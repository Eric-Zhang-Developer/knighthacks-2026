# Milestones: what ships when, in what order. Enforced in CI by .agents/scripts/check_gates.py.
# Agents pick the first ready feature in this file's order: milestones top to bottom (skipping ones whose ship time
# has passed), features left to right. A spec in no milestone is backlog and is never picked.
#
# ship    "+H:MM" after start · "YYYY-MM-DD" (through the end of that day, UTC) · an ISO time with offset · "" = none
# freeze  "H:MM" or "2d" before ship: only this milestone's features (and `allow`) merge as feat; fixes still merge;
#         anything on `cut` is rejected.
# final   the last milestone: from `report_before`, only fixes, reverts, docs and `allow`; at ship, nothing merges.
# The bootstrap feature always merges before any other feature.
#
# Defaults assume a 36-hour event, staged so the big idea never risks the safe one. Scale the offsets to yours.
start = "2026-10-09T19:00:00-04:00"   # Opening Ceremony, Fri Oct 9 (specs/context/event.md)

[[milestone]]
name = "safe-demo"        # R0: something trustworthy to show, early
ship = ""                 # no deadline (person, 2026-10-10): order only; the one real deadline is submission's
features = ["bootstrap", "corpus-fetch", "galaxy", "corpus-embed", "search", "project-drawer", "galaxy-explainer", "corpus-release"]
cut = []

[[milestone]]
name = "core"             # R1: what the judges score
ship = ""                 # no deadline (person, 2026-10-10): order only
features = ["visual-polish", "ai-client", "guest-workspace", "guest-workspace-ui", "voice", "idea-create-api", "idea-create-ui", "neighbor-evidence-api", "neighbor-evidence-ui", "idea-revisions-api", "idea-revisions-ui", "voice-replies-api", "voice-replies-ui", "challenge-api", "challenge-ui", "galaxy-history"]
cut = ["voice-replies-api", "voice-replies-ui"]   # person's decision 2026-10-10: push-to-talk input stays

[[milestone]]
name = "submission"       # R2/R3: the ambitious target and one stretch, then the freeze
ship = "2026-10-11T10:45:00-04:00"   # 15 min before the 11:00 final code push
freeze = "2:15"           # from Sun 08:30: no new features (person, 2026-10-10: 06:00 cut 2.5 h of build time while Devpost is written)
final = true
report_before = "1:45"    # from Sun 09:00: fixes, reverts and docs only; Devpost closes 10:00
features = ["db-sync", "live-mentor-api", "live-mentor-ui", "live-smoke", "decision-snapshot-api", "decision-snapshot-ui", "share-qr-api", "share-qr-ui", "team-vote-api", "team-vote-ui", "branches-api", "branches-ui", "compare-api", "compare-ui", "strongest-alternative-api", "strongest-alternative-ui", "prove-it-api", "prove-it-ui", "rubric-overlay-api", "rubric-overlay-ui", "combinations-api", "combinations-ui", "change-mind-api", "change-mind-ui", "moment-api", "moment-ui", "experience-shell", "constellation-ui", "research-api", "research-ui", "challenge-resume-ui", "problem-evidence-api", "problem-evidence-ui", "workspace-restore-api", "workspace-restore-ui", "search-filters-ui", "rehearsal-api", "rehearsal-ui", "demo-flow", "corpus-classify", "idea-interview-api", "galaxy-classes-ui", "galaxy-2d", "galaxy-3d", "design-refresh", "corpus-layout-2d", "idea-interview-ui", "build-plan-api", "build-plan-ui", "idea-scorecard-api", "idea-scorecard-ui", "era-board-ui", "ai-image-input", "sponsor-challenges-api", "sponsor-challenges-ui", "vultr-deploy", "ui-redesign"]
cut = ["compare-api", "compare-ui", "vultr-deploy", "era-board-ui", "idea-scorecard-ui", "idea-scorecard-api", "corpus-layout-2d"]   # first to drop if late; rejected once the freeze starts. corpus-layout-2d: galaxy-3d needs the real z (person, 2026-10-10)
allow = ["foreman"]       # the build-status page (specs/features/foreman): may merge through the freeze
